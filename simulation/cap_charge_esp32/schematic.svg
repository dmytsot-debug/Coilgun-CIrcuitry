<text x="100" y="752" class="t">Red tag = one wire to the red + rail. The rail itself gets ONE wire from the ESP32 3V3 pin.</text>
<line x1="70" y1="764" x2="70" y2="776" class="w"/><line x1="58" y1="776" x2="82" y2="776" class="w"/><line x1="62" y1="781" x2="78" y2="781" class="w"/><line x1="66" y1="786" x2="74" y2="786" class="w"/>
<text x="100" y="780" class="t">Ground symbol = one wire to the blue − rail. The rail itself gets ONE wire from the ESP32 GND pin.</text>
<text x="100" y="802" class="s">Each coloured pin needs only one wire, so one free hole next to it is enough. Code: NODE_PIN = 15, POT_PIN = 4.</text>
