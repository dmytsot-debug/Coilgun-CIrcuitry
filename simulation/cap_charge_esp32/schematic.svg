<text x="100" y="752" class="t">Every red 3V3 tag is a wire back to the 3V3 pin (top left). On a breadboard: plug 3V3 into the red + rail and grab it from there.</text>
<line x1="70" y1="764" x2="70" y2="776" class="w"/><line x1="58" y1="776" x2="82" y2="776" class="w"/><line x1="62" y1="781" x2="78" y2="781" class="w"/><line x1="66" y1="786" x2="74" y2="786" class="w"/>
<text x="100" y="780" class="t">Every ground symbol is a wire to GND. Put GND on the blue − rail. Both GND pins on the board are the same thing inside.</text>
<text x="100" y="802" class="s">Coloured dots on the board = pins you use. Grey = leave empty. Code pin names: D34 = 34, D35 = 35, D21 = 21, D22 = 22 (no code changes needed).</text>
