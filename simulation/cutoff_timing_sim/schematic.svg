<text x="560" y="34" font-size="20" font-weight="bold" text-anchor="middle">Cut-off timing sim: every wire on the LEFT side of the ESP32</text>
<text x="560" y="56" font-size="12" fill="#555" text-anchor="middle">Two light gates + a "coil" LED + OLED. Same breadboard layout as the stage 1–2 bench: right-side pins stay unused.</text>
