" stroke-width="1.5"/><text x="916" y="643" font-size="13" fill="#999" text-anchor="end" >VP</text><circle cx="772" cy="674" r="6" fill="#999" stroke="#fff" stroke-width="1.5"/><text x="784" y="679" font-size="13" fill="#999" text-anchor="start" >D23</text><circle cx="928" cy="674" r="6" fill="#999" stroke="#fff" stroke-width="1.5"/><text x="916" y="679" font-size="13" fill="#999" text-anchor="end" >EN</text><text x="962" y="420" fill="#555" font-size="11" transform="rotate(90 962 420)" text-anchor="middle">right side: nothing plugged in</text><polyline points="700,170 772,170" stroke="#d62828" stroke-width="2.5" fill="none"/><rect x="664" y="161" width="36" height="18" rx="3" fill="#d62828"/><text x="682" y="174" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3V3</text><polyline points="772,206 712,206 712,214" stroke="#000" stroke-width="2" fill="none"/><path d="M712 206v10M700 216h24M704 221h16M708 226h8" stroke="#000" stroke-width="2" fill="none"/><rect x="40" y="732" width="1040" height="78" rx="6" fill="#f3f3f3"/><rect x="56" y="739" width="36" height="18" rx="3" fill="#d62828"/><text x="74" y="752" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">3V3</text><text x="100" y="752" font-size="13" fill="#000" text-anchor="start" >Red tag = one wire to the red + rail. The rail gets ONE wire from the ESP32 3V3 pin.</text><path d="M70 766v10M58 776h24M62 781h16M66 786h8" stroke="#000" stroke-width="2" fill="none"/><text x="100" y="780" font-size="13" fill="#000" text-anchor="start" >Ground symbol = one wire to the blue − rail. The rail gets ONE wire from the ESP32 GND pin.</text><text x="100" y="800" font-size="11" fill="#555" text-anchor="start" >LED long leg (+) toward 3V3/D18. Each light LED faces its LDR 1–2 cm away with NO wire between them. Gates 50 mm apart. Code: GATE_A = 15, GATE_B = 4, COIL = 18.</text></svg>